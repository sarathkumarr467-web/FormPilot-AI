<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormPilot AI — Understand. Fill. Verify. Apply.</title>
  <meta name="description" content="Intelligent AI-powered application assistance platform for students, job seekers, and government schemes.">
  <link rel="icon" type="image/png" href="/static/images/formpilot-logo.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for live JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Bilingual Locales -->
  <script src="/static/locales.js"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0A1128',
              blue: '#1E3A8A',
              royal: '#2563EB',
              cyan: '#06B6D4',
              mint: '#10B981',
              violet: '#8B5CF6',
              amber: '#F59E0B',
              rose: '#F43F5E',
              darkbg: '#0B1120',
              darkcard: '#111827',
              darkborder: '#1E293B',
              lightbg: '#F8FAFC',
              lightcard: '#FFFFFF',
              lightborder: '#E2E8F0'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans Tamil', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', 'Noto Sans Tamil', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Glassmorphism accents */
    .glass-panel {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-[#0B1120] text-slate-100 antialiased selection:bg-brand-royal selection:text-white">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center space-y-4">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-lg font-medium text-slate-300">Loading FormPilot AI Platform...</p>
        <p class="text-xs text-slate-500">Understand. Fill. Verify. Apply.</p>
      </div>
    </div>
  </div>

  <!-- Main React Application -->
  <script type="text/babel" src="/static/app.jsx"></script>
</body>
</html>
